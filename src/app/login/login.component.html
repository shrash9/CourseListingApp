<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4" style="max-width: 400px; width: 100%;">
      <h3 class="card-title text-center mb-4">Log In</h3>
      <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            required
            [(ngModel)]="email"
            #emailField="ngModel"
          />
          <div
            class="invalid-feedback d-block"
            *ngIf="emailField.invalid && emailField.touched"
          >
            A valid email is required.
          </div>
        </div>
  
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            required
            minlength="6"
            [(ngModel)]="password"
            #passwordField="ngModel"
          />
          <div
            class="invalid-feedback d-block"
            *ngIf="passwordField.invalid && passwordField.touched"
          >
            Password (min 6 chars) is required.
          </div>
        </div>
  
        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="loginForm.invalid"
        >
          <i class="fas fa-sign-in-alt me-1"></i>
          Log In
        </button>
      </form>
  
      <div class="text-center mt-3">
        <a routerLink="/signup">Don’t have an account? Sign up.</a>
      </div>
    </div>
  </div>
