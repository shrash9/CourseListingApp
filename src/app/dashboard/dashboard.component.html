<div class="container mt-4">
    <div class="row mb-3">
      <div class="col-md-6">
        <input
          type="text"
          class="form-control"
          placeholder="Search by title"
          [(ngModel)]="searchTerm"
          (ngModelChange)="applyFilter()"
        />
      </div>
    </div>
  
    <div class="row">
      <div class="col-md-6 col-lg-3 mb-4" *ngFor="let course of display">
        <div class="card h-100 position-relative">
            <div
            class="card-img-top"
            [ngStyle]="{'background-image': 'url(' + course.imageUrl + ')'}"
          ></div>
          <span class="category-badge">
            {{ course.category }}
          </span>
          
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ course.title }}</h5>
            <p class="card-text">{{ course.description }}</p>
            <div class="d-flex justify-content-between small text-muted mb-2 mt-auto">
              <span>{{ course.questions }} questions</span>
              <span>{{ course.duration }} minutes</span>
            </div>
            <button
              class="btn btn-outline-primary w-100"
              [routerLink]="['/courses', course.id]"
            >
              View Details
            </button>
          </div>
        </div>
      </div>
    </div>
  
    <div class="text-center mt-4">
      <button
        class="btn btn-light border"
        (click)="loadMore()"
        [disabled]="page >= totalPages"
      >
        Load More
      </button>
    </div>
  </div>
